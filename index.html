<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢訓練家 - 作品集入口網站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --pkmn-red: #EE1515;
            --pkmn-dark-red: #B30000;
            --pkmn-yellow: #FFDE00;
            --pkmn-gold: #B3A125;
            --pkmn-blue: #3B4CCA;
            --pkmn-dark-blue: #2A3284;
            --pkmn-bg-green: #7AC74C;
            --pkmn-dark-green: #4A8522;
            --pkmn-box-bg: #F8F9FA;
            --pkmn-dark-bg: #1e252f;
            --pixel-border-color: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Press Start 2P', sans-serif;
            user-select: none;
        }

        body {
            background-color: #8cbe43;
            background-image: 
                radial-gradient(#a3d656 15%, transparent 16%),
                radial-gradient(#a3d656 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
            position: relative;
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 1000px;
            background-color: #e6f3d8;
            border: 6px solid var(--pixel-border-color);
            border-radius: 16px;
            box-shadow: 
                0 12px 0 rgba(0,0,0,0.3),
                inset 0 0 0 4px #ffffff,
                inset 0 0 0 8px #a8d870;
            padding: 30px 20px;
            position: relative;
            z-index: 10;
        }

        .trainer-card {
            background: #ffffff;
            border: 4px solid var(--pixel-border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .trainer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 12px;
            background: linear-gradient(90deg, var(--pkmn-red) 50%, #ffffff 50%);
            border-bottom: 3px solid var(--pixel-border-color);
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--pixel-border-color);
            background-color: #f0f8ff;
            object-fit: cover;
            image-rendering: pixelated;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .badge-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: var(--pkmn-yellow);
            border: 2px solid var(--pixel-border-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--pkmn-red);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }

        .trainer-info {
            text-align: center;
            width: 100%;
        }

        .trainer-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            color: var(--pkmn-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .trainer-name {
            font-size: 24px;
            font-weight: 900;
            color: #222;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0 #fff, 2px 2px 0 #ccc;
        }

        /* 經驗值條 (EXP Bar) */
        .exp-container {
            width: 80%;
            max-width: 320px;
            margin: 0 auto 12px auto;
            background: #444;
            border: 2px solid var(--pixel-border-color);
            border-radius: 10px;
            padding: 3px;
            position: relative;
        }
