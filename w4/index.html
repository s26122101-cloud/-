<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢動態留言板 - Pokémon Message Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: VT323 (像素風) 與 Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           [顏色與主題風格設定] - 可在此修改全站核心視覺色彩
           ========================================================================== */
        :root {
            --pkmn-red: #FF1C1C;        /* 經典寶可夢紅 */
            --pkmn-yellow: #FFDE00;     /* 皮卡丘黃 */
            --pkmn-blue: #3B4CCA;       /* 寶可夢藍 */
            --pkmn-dark-blue: #2A75BB;  /* 寶可夢深藍 */
            --pkmn-card-bg: #F8F9FA;    /* 卡片底色 */
            --pkmn-border: #333333;     /* 像素復古邊框色 */
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1a202c;
            /* 寶可夢暗色系點狀背景 */
            background-image: 
                radial-gradient(rgba(255, 222, 0, 0.15) 1px, transparent 0),
                radial-gradient(rgba(59, 76, 202, 0.15) 1px, #101520 50%);
            background-size: 24px 24px, 48px 48px;
            background-position: 0 0, 24px 24px;
            color: #333;
            min-height: 100vh;
        }

        /* 像素風格標題字體 */
        .pixel-font {
            font-family: 'VT323', monospace;
        }

        /* 寶可夢卡片風格 */
        .pkmn-card {
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
            border: 4px solid var(--pkmn-border);
            border-radius: 16px;
            box-shadow: 0 6px 0 var(--pkmn-border), 0 10px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            break-inside: avoid; /* 避免瀑布流分頁拆斷卡片 */
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* 寶可夢卡片頭部飾條 */
        .pkmn-card-header {
            background: linear-gradient(90deg, var(--pkmn-red) 0%, #e53e3e 100%);
            color: white;
            border-bottom: 3px solid var(--pkmn-border);
        }

        /* ==========================================================================
           [輪播亮起 Highlight 特效設定]
           ========================================================================== */
        /* 當卡片被輪播選中時的樣式 (焦點卡片) */
        .pkmn-card.highlight {
            transform: scale(1.08) translateY(-6px);
            z-index: 30;
            border-color: var(--pkmn-yellow) !important;
            box-shadow: 
                0 0 25px rgba(255, 222, 0, 0.8),
                0 0 10px rgba(255, 255, 255, 0.9),
                0 10px 0 var(--pkmn-border);
            opacity: 1 !important;
            filter: blur(0px) grayscale(0%) !important;
        }

        /* 當有卡片被選中時，其他未選中卡片的暗化/模糊樣式 */
        .masonry-wall.has-highlight .pkmn-card:not(.highlight) {
            opacity: 0.45;
            filter: blur(1.5px) grayscale(20%);
            transform: scale(0.96);
        }

        /* 瀑布流版型設定 (Masonry Layout) */
        .masonry-wall {
            column-count: 1;
            column-gap: 1.5rem;
        }

        @media (min-width: 640px) {
            .masonry-wall { column-count: 2; }
        }

        @media (min-width: 1024px) {
            .masonry-wall { column-count: 3; }
        }

        @media (min-width: 1280px) {
            .masonry-wall { column-count: 4; }
        }

        /* 精靈球旋轉 Loading 動畫 */
        .pokeball-spinner {
            width: 60px;
            height: 60px;
            background: linear-gradient(to bottom, #FF1C1C 50%, #FFFFFF 50%);
            border-radius: 50%;
            border: 5px solid #000;
            position: relative;
            animation: spin 1.2s infinite linear, bounce 0.8s infinite alternate ease-in-out;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .pokeball-spinner::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 5px;
            background: #000;
            transform: translateY(-50%);
        }

        .pokeball-spinner::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            background: #FFF;
            border: 4px solid #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0% { translateY: 0px; }
            100% { translateY: -15px; }
        }

        /* 復古街機風格按鈕 */
        .retro-btn {
            background-color: var(--pkmn-yellow);
            color: #000;
            font-weight: bold;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s ease;
        }

        .retro-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000;
            background-color: #fff066;
        }

        .retro-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #101520;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--pkmn-red);
            border-radius: 5px;
            border: 2px solid #101520;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- ==========================================================================
         [頁面頂部：寶可夢風格標頭與控制面板]
         ========================================================================== -->
    <header class="max-w-6xl mx-mx-auto text-center mb-8 mx-auto">
        <!-- 標題區域 -->
        <div class="inline-block bg-red-600 border-4 border-black px-6 py-3 rounded-2xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] mb-4">
            <h1 class="text-3xl md:text-5xl font-black text-yellow-300 tracking-wider flex items-center justify-center gap-3 drop-shadow-[2px_2px_0px_rgba(0,0,0,1)]">
                <i class="fa-solid font-bold fa-circle-dot text-white animate-pulse"></i>
                訓練家留言板
                <i class="fa-solid font-bold fa-circle-dot text-white animate-pulse"></i>
            </h1>
            <p class="text-white text-xs md:text-sm mt-1 font-bold tracking-widest uppercase">Friends' Message Gallery Wall</p>
        </div>

        <!-- 控制工具列 (播放/暫停/跳轉) -->
        <div class="bg-gray-800 border-2 border-gray-600 rounded-xl p-3 max-w-xl mx-auto flex flex-wrap items-center justify-between gap-3 text-white text-sm shadow-lg">
            <div class="flex items-center gap-2">
                <button id="togglePlayBtn" class="retro-btn px-3 py-1.5 rounded-lg text-xs md:text-sm flex items-center gap-1">
                    <i class="fa-solid fa-pause" id="playIcon"></i>
                    <span id="playText">暫停輪播</span>
                </button>
                <button id="prevBtn" class="bg-gray-700 hover:bg-gray-600 border border-black px-2.5 py-1.5 rounded-lg text-xs">
                    <i class="fa-solid fa-backward"></i> 上一張
                </button>
                <button id="nextBtn" class="bg-gray-700 hover:bg-gray-600 border border-black px-2.5 py-1.5 rounded-lg text-xs">
                    下一張 <i class="fa-solid fa-forward"></i>
                </button>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-gray-400 text-xs"><i class="fa-solid fa-gauge-high"></i> 輪播卡片:</span>
                <span id="currentCardBadge" class="bg-yellow-400 text-black px-2 py-0.5 rounded font-mono text-xs font-bold">0 / 0</span>
            </div>
        </div>
    </header>

    <!-- ==========================================================================
         [讀取中狀態：寶可夢主題酷炫動畫]
         ========================================================================== -->
    <div id="loadingContainer" class="flex flex-col items-center justify-center py-20">
        <div class="pokeball-spinner mb-6"></div>
        <div class="text-yellow-400 font-bold text-xl md:text-2xl tracking-widest pixel-font animate-pulse">
            讀取留言中... GOTTA CATCH 'EM ALL!
        </div>
        <p class="text-gray-400 text-xs mt-2">正在連結至皮卡丘數據庫傳輸悄悄話...</p>
    </div>

    <!-- ==========================================================================
         [主要資料展示區：瀑布流留言牆]
         ========================================================================== -->
    <main class="max-w-7xl mx-auto">
        <div id="masonryContainer" class="masonry-wall hidden">
            <!-- 留言卡片將會由 JavaScript 動態插入至此 -->
        </div>

        <!-- 錯誤或無資料時的提示區 -->
        <div id="errorContainer" class="hidden text-center py-12 bg-gray-800 border-2 border-red-500 rounded-xl p-6 max-w-md mx-auto">
            <i class="fa-solid fa-triangle-exclamation text-red-400 text-4xl mb-3"></i>
            <h3 class="text-white font-bold text-lg">資料載入發生狀況</h3>
            <p id="errorMessage" class="text-gray-300 text-sm mt-2">無法讀取表單資料，已自動切換為備用展示留言。</p>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="text-center text-gray-500 text-xs py-8 mt-12">
        <p>Pokémon Theme Message Board &copy; 2026 | Powered by PokéAPI & Google Sheet CSV</p>
    </footer>

    <!-- ==========================================================================
         [JAVASCRIPT 邏輯與串接]
         ========================================================================== -->
    <script>
        // ==========================================================================
        // ===== [關鍵設定區：網址與輪播參數] =====
        // ==========================================================================

        /**
         * 1. Google 試算表 / 表單 CSV 網址設定
         * 注意：使用者提供的 viewform 連結無法直接輸出 CSV。
         * 此處已為您自動轉換為響應 CSV 下載格式。若發布至網頁的 CSV 網址無效，程式將會自動載入經典預設備份資料。
         */
        const GOOGLE_FORM_VIEW_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdrO4SsJlRPwsKIhOU1XBhhzwgcQ2NnAqZnFwXEJc56Euj0uw/viewform?usp=header";
        
        // 自動嘗試將 viewform 轉為發布 Responses 的 CSV 連結 (或可在底下替換為您的 Google Sheet CSV 連結)
        const CSV_FETCH_URL = GOOGLE_FORM_VIEW_URL.replace(/\/viewform.*/, '/published/pub?output=csv');

        /**
         * 2. [輪播秒數設定]
         * 單位為毫秒 (ms)。例如：3000 代表 3 秒鐘換下一張卡片。
         */
        const CAROUSEL_INTERVAL_MS = 3000; // <--- 可在此處修改輪播間隔秒數 (預設 3000ms = 3秒)

        // 全域變數狀態
        let messagesData = [];          // 儲存解析後的留言陣列
        let currentIndex = -1;          // 目前高亮焦點卡片的索引
        let carouselTimer = null;       // 輪播計時器 ID
        let isPlaying = true;           // 播放狀態

        // 寶可夢靈魂頭像圖片清單 (從 PokéAPI 精靈圖庫動態取得)
        const POKEMON_AVATARS = [
            { name: "皮卡丘", id: 25, type: "電" },
            { name: "小火龍", id: 4, type: "火" },
            { name: "傑尼龜", id: 7, type: "水" },
            { name: "妙蛙種子", id: 1, type: "草" },
            { name: "伊布", id: 133, type: "一般" },
            { name: "耿鬼", id: 94, type: "幽靈" },
            { name: "卡比獸", id: 143, type: "一般" },
            { name: "胖丁", id: 39, type: "妖精" },
            { name: "超夢", id: 150, type: "超能力" },
            { name: "可達鴨", id: 54, type: "水" },
            { name: "波克比", id: 175, type: "妖精" },
            { name: "百變怪", id: 132, type: "一般" }
        ];

        // 預備備份資料 (當 Google 試算表未開放權限或網路失敗時備用，確保畫面完美展現)
        const FALLBACK_MOCK_DATA = [
            ["2026/03/30 10:00:00", "小智", "S11059001", "就決定是你了！祝你的留言板專案大獲成功，邁向神奇寶貝大師之路！加油！"],
            ["2026/03/30 10:15:30", "小霞", "S11059002", "這網站設計得太討喜了吧！波克比說牠超級喜歡這個寶可夢風格～卡片會發光好酷喔！"],
            ["2026/03/30 11:20:12", "大木博士", "S11059003", "嗯！精密的程式碼、漂亮的瀑布流排版！你在前端工程領域的進化真是令人驚豔啊！"],
            ["2026/03/30 12:05:44", "火箭隊武藏", "S11059004", "既然你誠心誠意的發問了，我就大發慈悲地在此留言！這個輪播特效確實有點東西嘛！"],
            ["2026/03/30 13:40:00", "小剛", "S11059005", "我剛煮好寶可夢飯糰，看完這個留言板發現太驚豔了！下次教我怎麼寫 JavaScript 吧！"],
            ["2026/03/30 14:12:19", "莎莉娜", "S11059006", "恭喜專案順利完成！畫面的每一個細節都好精緻，會自動亮起來的展示氛圍太棒了！"]
        ];

        // ==========================================================================
        // ===== [頁面初始化入口] =====
        // ==========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            fetchMessageData();
            setupControlListeners();
        });

        /**
         * 從 Google 試算表 CSV 抓取資料
         */
        async function fetchMessageData() {
            showLoading(true);

            try {
                // 發起 Fetch 請求抓取 CSV
                const response = await fetch(CSV_FETCH_URL, { cache: 'no-cache' });
                
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤: ${response.status}`);
                }

                const csvText = await response.text();
                
                // 解析 CSV 資料
                const parsedData = parseCSV(csvText);

                // 若 CSV 解析出的資料列小於 2 (只有標題列或為空)，嘗試使用 fallback
                if (!parsedData || parsedData.length <= 1) {
                    console.warn("CSV 資料長度不足，切換至預設備份資料。");
                    messagesData = processParsedRows(FALLBACK_MOCK_DATA);
                } else {
                    // 移除第一列標題列
                    const contentRows = parsedData.slice(1);
                    messagesData = processParsedRows(contentRows);
                }
            } catch (err) {
                console.error("無法從 Google 試算表抓取 CSV (可能是網址權限未公開或 CORS 限制):", err);
                // 使用備用資料
                messagesData = processParsedRows(FALLBACK_MOCK_DATA);
            } finally {
                showLoading(false);
                renderMessageCards();
                startCarousel();
            }
        }

        /**
         * 健全的 CSV 解析函式 (正確處理雙引號包覆、包含逗號或換行符號的留言)
         * @param {string} text - 原始 CSV 文字
         * @returns {Array<Array<string>>} 解析後的二維陣列
         */
        function parseCSV(text) {
            const result = [];
            let row = [];
            let currentToken = '';
            let insideQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        // 轉義的雙引號 ("")
                        currentToken += '"';
                        i++;
                    } else {
                        // 切換引號狀態
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    row.push(currentToken.trim());
                    currentToken = '';
                } else if ((char === '\r' || char === '\n') && !insideQuotes) {
                    if (char === '\r' && nextChar === '\n') {
                        i++; // Skip \n in \r\n
                    }
                    row.push(currentToken.trim());
                    if (row.some(field => field.length > 0)) {
                        result.push(row);
                    }
                    row = [];
                    currentToken = '';
                } else {
                    currentToken += char;
                }
            }

            if (currentToken.length > 0 || row.length > 0) {
                row.push(currentToken.trim());
                result.push(row);
            }

            return result;
        }

        /**
         * 整理並清洗 CSV 解析出的資料結構
         * 欄位對應: [0: 時間戳記, 1: 名字, 2: 學號, 3: 悄悄話]
         */
        function processParsedRows(rows) {
            return rows.filter(row => row.length >= 2 && row[1]).map((row, idx) => {
                const randomAvatar = POKEMON_AVATARS[idx % POKEMON_AVATARS.length];
                return {
                    id: idx,
                    timestamp: row[0] || '未知時間',
                    name: row[1] || '匿名訓練家',
                    studentId: row[2] || '',
                    message: row[3] || (row[2] && row[2].length > 10 ? row[2] : '這傢伙很懶，什麼都沒留下...'), // 欄位防護
                    pokemon: randomAvatar
                };
            });
        }

        /**
         * 渲染動態卡片牆 (Masonry 瀑布流)
         */
        function renderMessageCards() {
            const container = document.getElementById('masonryContainer');
            container.innerHTML = '';

            if (messagesData.length === 0) {
                showError("目前尚無留言資料。");
                return;
            }

            messagesData.forEach((item, index) => {
                const spriteUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${item.pokemon.id}.png`;

                const cardHTML = `
                    <div class="pkmn-card p-4" id="card-${index}" data-index="${index}">
                        <!-- 卡片頭部裝飾條 -->
                        <div class="pkmn-card-header -mx-4 -mt-4 p-3 mb-3 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="bg-yellow-300 text-black font-black text-xs px-2 py-0.5 rounded-full border border-black">
                                    LV.${Math.floor(Math.random() * 50) + 50}
                                </span>
                                <h3 class="font-bold text-white text-base tracking-wide truncate max-w-[140px]">
                                    ${escapeHTML(item.name)}
                                </h3>
                            </div>
                            <span class="text-xs text-yellow-200 font-mono opacity-90">
                                ${escapeHTML(item.studentId)}
                            </span>
                        </div>

                        <!-- 寶可夢頭像與悄悄話內文區 -->
                        <div class="flex gap-3 items-start">
                            <!-- 精靈圖圖示 -->
                            <div class="flex-shrink-0 w-16 h-16 bg-gradient-to-b from-blue-100 to-indigo-100 border-2 border-black rounded-xl p-1 relative flex items-center justify-center shadow-inner">
                                <img src="${spriteUrl}" alt="${item.pokemon.name}" class="w-full h-full object-contain drop-shadow" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${item.pokemon.id}.png'">
                                <span class="absolute -bottom-2 -right-1 bg-red-500 text-white text-[10px] px-1 rounded border border-black font-bold">
                                    ${item.pokemon.name}
                                </span>
                            </div>

                            <!-- 留言文字內文 -->
                            <div class="flex-1">
                                <p class="text-gray-800 text-sm leading-relaxed font-medium break-words whitespace-pre-line bg-white/70 p-2.5 rounded-lg border border-gray-200">
                                    “${escapeHTML(item.message)}”
                                </p>
                            </div>
                        </div>

                        <!-- 底部時間戳記 -->
                        <div class="mt-3 pt-2 border-t border-gray-200 flex justify-between items-center text-[11px] text-gray-500">
                            <span class="flex items-center gap-1">
                                <i class="fa-regular fa-clock"></i> ${escapeHTML(item.timestamp)}
                            </span>
                            <span class="text-xs font-bold text-blue-600">
                                #PKMN-${index + 1}
                            </span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });

            // 更新總卡片計數標籤
            updateCounterBadge();
            container.classList.remove('hidden');
        }

        // ==========================================================================
        // ===== [動態輪播與 Highlight 焦點特效邏輯] =====
        // ==========================================================================

        /**
         * 啟動自動輪播計時器
         */
        function startCarousel() {
            if (carouselTimer) clearInterval(carouselTimer);
            
            // 立即執行第一次聚焦高亮
            highlightNextCard();

            // 設定週期性輪播 (預設每 CAROUSEL_INTERVAL_MS 秒觸發一次)
            carouselTimer = setInterval(() => {
                if (isPlaying) {
                    highlightNextCard();
                }
            }, CAROUSEL_INTERVAL_MS);
        }

        /**
         * 切換高亮亮起下一張卡片 (重點功能)
         */
        function highlightNextCard() {
            if (messagesData.length === 0) return;

            // 計算下一張卡片索引 (0 -> N-1 -> 0 循環)
            currentIndex = (currentIndex + 1) % messagesData.length;
            setActiveCard(currentIndex);
        }

        /**
         * 設定指定索引卡片的高亮 Highlight 狀態
         * @param {number} index - 欲亮起的卡片索引
         */
        function setActiveCard(index) {
            const container = document.getElementById('masonryContainer');
            const allCards = document.querySelectorAll('.pkmn-card');

            if (allCards.length === 0) return;

            // 標示容器有選中的高亮卡片 (開啟未選中卡片的模糊/半透明效果)
            container.classList.add('has-highlight');

            // 移除所有卡片的 highlight 樣式
            allCards.forEach(card => card.classList.remove('highlight'));

            // 為當前卡片加上 Highlight 高亮發光樣式
            const targetCard = document.getElementById(`card-${index}`);
            if (targetCard) {
                targetCard.classList.add('highlight');

                // 平滑滾動確保高亮卡片呈現於視野中
                targetCard.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest'
                });
            }

            updateCounterBadge();
        }

        /**
         * 更新頁面上的計數器標籤
         */
        function updateCounterBadge() {
            const badge = document.getElementById('currentCardBadge');
            if (messagesData.length > 0) {
                badge.textContent = `${currentIndex + 1} / ${messagesData.length}`;
            } else {
                badge.textContent = `0 / 0`;
            }
        }

        /**
         * 設定控制按鈕的事件監聽
         */
        function setupControlListeners() {
            const toggleBtn = document.getElementById('togglePlayBtn');
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            // 播放/暫停按鈕
            toggleBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                if (isPlaying) {
                    playIcon.className = "fa-solid fa-pause";
                    playText.textContent = "暫停輪播";
                } else {
                    playIcon.className = "fa-solid fa-play";
                    playText.textContent = "繼續輪播";
                }
            });

            // 上一張卡片
            prevBtn.addEventListener('click', () => {
                if (messagesData.length === 0) return;
                currentIndex = (currentIndex - 1 + messagesData.length) % messagesData.length;
                setActiveCard(currentIndex);
            });

            // 下一張卡片
            nextBtn.addEventListener('click', () => {
                if (messagesData.length === 0) return;
                currentIndex = (currentIndex + 1) % messagesData.length;
                setActiveCard(currentIndex);
            });
        }

        // ==========================================================================
        // ===== [工具函式：Loading & HTML 轉義] =====
        // ==========================================================================

        function showLoading(isLoading) {
            const loadingEl = document.getElementById('loadingContainer');
            if (isLoading) {
                loadingEl.classList.remove('hidden');
            } else {
                loadingEl.classList.add('hidden');
            }
        }

        function showError(msg) {
            showLoading(false);
            const errEl = document.getElementById('errorContainer');
            const msgEl = document.getElementById('errorMessage');
            msgEl.textContent = msg;
            errEl.classList.remove('hidden');
        }

        // 防止 XSS 攻擊的字串安全轉義函式
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
